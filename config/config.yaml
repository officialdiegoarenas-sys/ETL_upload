project_name: "ETL Entidades de Control, Fiscalia y Policia"
author: "Diego Fernando Arenas Lasso, Miguel Angel Herrera Santanilla, Nayda Liseth Sierra Jaramillo, Kevin Ospina Gamboa, Santiago Navia Soto"
version: "1.0.0"
environment: "production"

# Estructura (Arquitectura Medallón)
paths:
  bronze: "data/bronze"
  silver: "data/silver"
  gold: "data/gold"
  logs: "logs"

# Configuración de la extracción de Datos
sources:
  api_secop: 
    url: "https://www.datos.gov.co/resource/p6dx-8zbt.json?$limit=100"
    timeout_seconds: 30 #Si no tengo los datos en 30 segundos, se cancela la solicitud y se considera un error.
    max_retries: 3 #Debe esperar un momento y volver a intentar descargar los datos hasta 3 veces si la pagina no responde o si hay un error de red.
  api_procuraduria:
    url: "https://www.datos.gov.co/resource/iaeu-rcn6.csv"   # toda la base, descargada paginada (25.000 filas por solicitud)
    timeout_seconds: 45 #Si no tengo los datos en 30 segundos, se cancela la solicitud y se considera un error.
    max_retries: 3 #debe esperar un momento y volver a intentar descargar los datos hasta 3 veces si la pagina no responde o si hay un error de red.
  api_policia:
    dataset_id: "3jdh-nmwu"
    url: "https://www.datos.gov.co/resource/3jdh-nmwu.csv"
    timeout_seconds: 300
    max_retries: 5

# Parámetros de monitoreo y ejecución automática
execution:
  schedule_interval_hours: 24 #todavia no se realiza esta parte, es para un FUTURO
  log_level: "INFO"   # Se registra cada vez que existan una ejecución del pipeline
  enable_hardware_monitoring: true # Habilita el monitoreo de recursos del hardware
  system_alert_email: "noexiste@dominio.com" # Es un correo para recibir alertas del sistema en caso de errores  o falloscuando se corre el ETL que estmoa haciendo.

Repository: "https://github.com/officialdiegoarenas-sys/ETL_upload"
Date: "2026-09-29"


# Dashboard (Streamlit) - carpeta App dentro de la raiz del proyecto (el "medallon" de clase)
app:
  nombre: "Tablero de Entidades de Control"
  carpeta: "App"
  fuente_datos: "api"            # "api" consume FastAPI (si no responde, usa el csv) | "csv" lee data/gold directo
  api_url: "http://127.0.0.1:8000"
  datasets:                       # nombre logico -> archivo de la capa Gold
    etapa: "fiscalia_procesos_etapa_gold.csv"
    departamento: "fiscalia_procesos_departamento_gold.csv"
    anio_capitulo: "fiscalia_procesos_año_capitulo_gold.csv"
    top_delitos: "fiscalia_top_delitos_gold.csv"
    sentencias: "fiscalia_procesados_sentencias_gold.csv"
    perfil: "fiscalia_perfil_condenados_gold.csv"
    secop: "datos_secop_gold.csv"
    procuraduria: "resumen_procuraduria_gold.csv"
    contraloria: "dataset_contraloria.csv"
